<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajero del Corazón — Carrito</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--v:#7b3f98;--vd:#5d2877;--vl:#f3eafa;--text:#302536;--muted:#7c7180;--green:#25D366}
body{font-family:Arial,Helvetica,sans-serif;background:#faf7fc;color:var(--text)}
.shop{max-width:1100px;margin:auto;padding:28px 20px 50px}
.header{text-align:center;margin-bottom:30px}.header h1{color:var(--vd);font-size:32px;margin-bottom:8px}.header p{color:var(--muted);font-size:15px}
.categories{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.category-btn{border:1px solid #dfd0e5;background:#fff;color:var(--vd);padding:9px 15px;border-radius:999px;cursor:pointer;font-weight:bold}
.category-btn.active,.category-btn:hover{background:var(--v);color:#fff}
.category{margin-bottom:34px}.category-title{color:var(--vd);font-size:24px;margin-bottom:15px;border-bottom:1px solid #e8ddea;padding-bottom:8px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.product{background:#fff;border:1px solid #eee5f1;border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(80,40,90,.08);transition:.2s}
.product:hover{transform:translateY(-3px)}
.product img{width:100%;height:180px;object-fit:cover;display:block}
.product-content{padding:17px}.product h3{color:var(--vd);font-size:18px;margin-bottom:7px}
.description{color:var(--muted);font-size:14px;line-height:1.45;min-height:40px;margin-bottom:11px}
.price{font-size:19px;font-weight:bold;color:var(--v);margin-bottom:12px}
.add-button{width:100%;border:0;border-radius:10px;padding:11px;background:var(--v);color:#fff;font-size:14px;font-weight:bold;cursor:pointer}.add-button:hover{background:var(--vd)}
.cart{margin-top:35px;background:#fff;border:1px solid #eee5f1;border-radius:20px;padding:25px;box-shadow:0 6px 24px rgba(80,40,90,.08)}
.cart h2{color:var(--vd);margin-bottom:18px}.empty{text-align:center;color:#8b808f;padding:20px}
.cart-item{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid #eee5f1}
.item-name{font-weight:bold;margin-bottom:4px}.item-price{color:var(--v);font-size:14px}
.quantity{display:flex;align-items:center;gap:9px}.quantity button{width:30px;height:30px;border:0;border-radius:50%;background:#eee4f1;color:var(--vd);font-weight:bold;cursor:pointer}
.remove{border:0;background:transparent;color:#a24c67;cursor:pointer;font-size:13px}
.cart-total{display:flex;justify-content:space-between;font-size:21px;font-weight:bold;padding:20px 0;color:#4d205f}
.checkout{width:100%;border:0;border-radius:12px;padding:15px;background:var(--green);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.checkout:hover{filter:brightness(.94)}
.notice{margin-top:12px;font-size:12px;color:#817582;text-align:center}
.toast{position:fixed;right:20px;bottom:20px;background:var(--vd);color:#fff;padding:13px 17px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,.18);opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:650px){.shop{padding:20px 14px 40px}.header h1{font-size:27px}.cart-item{grid-template-columns:1fr auto}.remove{grid-column:1/2;text-align:left}.cart-item>strong{grid-column:2;grid-row:1}}
</style>
</head>
<body>
<div class="shop">
<header class="header">
<h1>💜 Mensajero del Corazón</h1>
<p>Elegí tus detalles y armá tu pedido.</p>
</header>

<div class="categories" id="categoryButtons"></div>
<div id="catalog"></div>

<section class="cart">
<h2>🛒 Tu pedido</h2>
<div id="cartItems"><div class="empty">Todavía no agregaste ningún producto.</div></div>
<div class="cart-total"><span>Total</span><span id="cartTotal">$0</span></div>
<button class="checkout" onclick="sendWhatsApp()">Confirmar pedido por WhatsApp</button>
<div class="notice">Al confirmar, se abrirá WhatsApp con el detalle de tu pedido.</div>
</section>
</div>
<div id="toast" class="toast">Agregado al carrito 💜</div>

<script>
const WHATSAPP_NUMBER = "5492996155433";
const DEFAULT_PRICE = 150000;

const products = [
 {category:"Amor",name:"Primer Detalle",desc:"Un detalle especial para comenzar a expresar lo que sentís."},
 {category:"Amor",name:"Me Gustás",desc:"Para decir algo que quizás cuesta decir en persona."},
 {category:"Amor",name:"Amor Bonito",desc:"Un detalle pensado para transmitir cariño de una manera especial."},
 {category:"Amor",name:"Te Amo",desc:"Para una de esas ocasiones que merecen algo inolvidable."},
 {category:"Amor",name:"Siempre Vos",desc:"Un detalle para recordar que, entre todos, siempre hay alguien especial."},
 {category:"Amor",name:"Personalizado",desc:"Un detalle creado especialmente para esa persona y esa ocasión."},

 {category:"Familia",name:"Te amo, Mamá",desc:"Un detalle para agradecerle a mamá todo su amor."},
 {category:"Familia",name:"Te amo, Papá",desc:"Un detalle para hacerle saber a papá cuánto significa."},
 {category:"Familia",name:"Siempre Juntos",desc:"Para celebrar ese vínculo que permanece siempre."},
 {category:"Familia",name:"Para vos, hermanito/a",desc:"Un detalle especial para ese hermano o hermana que siempre está."},

 {category:"Agradecimientos",name:"Un Pequeño Gracias",desc:"A veces un pequeño detalle dice muchísimo."},
 {category:"Agradecimientos",name:"Gracias por Tanto",desc:"Para agradecer todo aquello que una persona hizo por vos."},
 {category:"Agradecimientos",name:"Gracias de Corazón",desc:"Un agradecimiento profundo convertido en un detalle especial."},

 {category:"Celebrar",name:"Un Detallito",desc:"Porque cualquier motivo puede convertirse en una celebración."},
 {category:"Celebrar",name:"¡Felicitaciones!",desc:"Para acompañar una buena noticia y celebrar un logro."},
 {category:"Celebrar",name:"Hoy Se Festeja",desc:"Un detalle para disfrutar y festejar un momento especial."},
 {category:"Celebrar",name:"A lo Grande",desc:"Para esas ocasiones que realmente merecen celebrarse."},

 {category:"Homenaje",name:"Siempre en el Corazón",desc:"Un detalle para recordar, homenajear y mantener vivo el amor."}
];

const categoryImages = {
 Amor:"https://images.unsplash.com/photo-1518895949257-7621c3c786d7?auto=format&fit=crop&w=900&q=80",
 Familia:"https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=900&q=80",
 Agradecimientos:"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=900&q=80",
 Celebrar:"https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=900&q=80",
 Homenaje:"https://images.unsplash.com/photo-1504198453319-5ce911bafcde?auto=format&fit=crop&w=900&q=80"
};

let cart=JSON.parse(localStorage.getItem("mensajeroCart")||"[]");

function formatPrice(n){return "$"+n.toLocaleString("es-AR");}
function saveCart(){localStorage.setItem("mensajeroCart",JSON.stringify(cart));}

function renderCatalog(){
 const catalog=document.getElementById("catalog");
 const buttons=document.getElementById("categoryButtons");
 const cats=[...new Set(products.map(p=>p.category))];
 buttons.innerHTML='<button class="category-btn active" onclick="filterCategory(\'Todas\',this)">Todas</button>'+
 cats.map(c=>`<button class="category-btn" onclick="filterCategory('${c}',this)">${c}</button>`).join("");

 catalog.innerHTML=cats.map(cat=>`
 <section class="category" data-category="${cat}">
   <h2 class="category-title">${cat}</h2>
   <div class="products">
   ${products.filter(p=>p.category===cat).map(p=>`
    <article class="product">
      <img src="${categoryImages[cat]}" alt="${p.name}">
      <div class="product-content">
        <h3>${p.name}</h3>
        <p class="description">${p.desc}</p>
        <div class="price">${formatPrice(DEFAULT_PRICE)}</div>
        <button class="add-button" onclick="addToCart('${p.name.replace(/'/g,"\\'")}',${DEFAULT_PRICE})">Añadir al carrito</button>
      </div>
    </article>
   `).join("")}
   </div>
 </section>`).join("");
}

function filterCategory(category,button){
 document.querySelectorAll(".category-btn").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 document.querySelectorAll(".category").forEach(section=>{
   section.style.display=(category==="Todas"||section.dataset.category===category)?"block":"none";
 });
}

function addToCart(name,price){
 const existing=cart.find(item=>item.name===name);
 if(existing) existing.quantity++;
 else cart.push({name,price,quantity:1});
 saveCart();renderCart();showToast();
}

function changeQuantity(index,amount){
 cart[index].quantity+=amount;
 if(cart[index].quantity<=0)cart.splice(index,1);
 saveCart();renderCart();
}

function removeItem(index){cart.splice(index,1);saveCart();renderCart();}

function renderCart(){
 const container=document.getElementById("cartItems"),totalElement=document.getElementById("cartTotal");
 if(!cart.length){container.innerHTML='<div class="empty">Todavía no agregaste ningún producto.</div>';totalElement.textContent="$0";return;}
 let total=0;container.innerHTML="";
 cart.forEach((item,index)=>{
   const subtotal=item.price*item.quantity;total+=subtotal;
   const row=document.createElement("div");row.className="cart-item";
   row.innerHTML=`
    <div><div class="item-name">${item.name}</div><div class="item-price">${formatPrice(item.price)} c/u</div></div>
    <div class="quantity"><button onclick="changeQuantity(${index},-1)">−</button><strong>${item.quantity}</strong><button onclick="changeQuantity(${index},1)">+</button></div>
    <strong>${formatPrice(subtotal)}</strong>
    <button class="remove" onclick="removeItem(${index})">Eliminar</button>`;
   container.appendChild(row);
 });
 totalElement.textContent=formatPrice(total);
}

function sendWhatsApp(){
 if(!cart.length){alert("Primero agregá algún producto al carrito.");return;}
 let total=0;
 let message="Hola! 💜 Quiero hacer un pedido en Mensajero del Corazón.\n\n";
 cart.forEach(item=>{
   const subtotal=item.price*item.quantity;total+=subtotal;
   message+=`🌹 ${item.name} × ${item.quantity} — ${formatPrice(subtotal)}\n`;
 });
 message+=`\n💜 Total: ${formatPrice(total)}`;
 window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(message),"_blank");
}

function showToast(){
 const toast=document.getElementById("toast");toast.classList.add("show");
 setTimeout(()=>toast.classList.remove("show"),1600);
}

renderCatalog();renderCart();
</script>
</body>
</html>
